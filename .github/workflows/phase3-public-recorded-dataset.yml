name: Phase 3 Public Recorded Dataset

on:
  push:
    paths:
      - "src/positive_emotion_engine/physionet_stress_dataset.py"
      - "src/positive_emotion_engine/state_inference.py"
      - "tests/test_physionet_stress_dataset.py"
      - "tests/test_phase3_state_inference.py"
      - "scripts/validate_physionet_stress_dataset.py"
      - ".github/workflows/phase3-public-recorded-dataset.yml"
  pull_request:
    paths:
      - "src/positive_emotion_engine/physionet_stress_dataset.py"
      - "src/positive_emotion_engine/state_inference.py"
      - "tests/test_physionet_stress_dataset.py"
      - "tests/test_phase3_state_inference.py"
      - "scripts/validate_physionet_stress_dataset.py"
      - ".github/workflows/phase3-public-recorded-dataset.yml"
  workflow_dispatch:

jobs:
  physionet-stress-recorded-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Unit and contract tests
        run: >-
          pytest -q
          tests/test_phase3_state_inference.py
          tests/test_physionet_stress_dataset.py
      - name: Download pinned PhysioNet v1.0.1 stress files
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/physionet-stress"
          mkdir -p "$ROOT/Wearable_Dataset/STRESS/f10"
          BASE="https://physionet.org/files/wearable-device-dataset/1.0.1"
          curl -fL --retry 3 "$BASE/Stress_Level_v1.csv" -o "$ROOT/Stress_Level_v1.csv"
          curl -fL --retry 3 "$BASE/Stress_Level_v2.csv" -o "$ROOT/Stress_Level_v2.csv"
          curl -fL --retry 3 "$BASE/Wearable_Dataset/STRESS/f10/EDA.csv" -o "$ROOT/Wearable_Dataset/STRESS/f10/EDA.csv"
          curl -fL --retry 3 "$BASE/Wearable_Dataset/STRESS/f10/HR.csv" -o "$ROOT/Wearable_Dataset/STRESS/f10/HR.csv"
          curl -fL --retry 3 "$BASE/Wearable_Dataset/STRESS/f10/tags.csv" -o "$ROOT/Wearable_Dataset/STRESS/f10/tags.csv"
      - name: Verify published SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/physionet-stress"
          cd "$ROOT"
          cat > SHA256SUMS.selected <<'EOF'
          728ddaa128851f80b48a715b5144a9c5d4573652bc71b9797861795121bf1370  Stress_Level_v1.csv
          cbb51cd349f2a46d4942c393124b285d3cc37e510a30b0b72dcd8c023022dbf1  Stress_Level_v2.csv
          82ded11db4fdc833a8ddf65e8bf45a7a5f0da1516c05e12fb24f85e11cdec5a6  Wearable_Dataset/STRESS/f10/EDA.csv
          67c1ad45b95540509a3b6c1f57daa1ed4663fb79e5478f74ed91984a0ddaee20  Wearable_Dataset/STRESS/f10/HR.csv
          791704e35e4bc0f900095823fc2b1b66ef9b9df64fd7cb2a03e090f8c607edef  Wearable_Dataset/STRESS/f10/tags.csv
          EOF
          sha256sum -c SHA256SUMS.selected
      - name: Validate actual deidentified recording and labels
        run: python scripts/validate_physionet_stress_dataset.py "$RUNNER_TEMP/physionet-stress"
