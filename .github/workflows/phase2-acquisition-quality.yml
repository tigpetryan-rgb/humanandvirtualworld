name: Phase 2 Acquisition Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase2-acquisition-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Phase 1 regression tests
        run: python -m pytest -q tests/test_phase1_reference_pipeline.py
      - name: Run Phase 2 acquisition quality tests
        run: python -m pytest -q tests/test_phase2_acquisition_quality.py tests/test_empatica_e4_adapter.py
