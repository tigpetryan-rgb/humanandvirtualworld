name: Phase 2 Public Recorded Dataset

on:
  push:
    branches: [main]
  pull_request:

jobs:
  physionet-empatica-recorded-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Download deidentified PhysioNet EDA and IBI
        run: |
          mkdir -p .ci-data
          curl --fail --location --retry 3 --output .ci-data/EDA.csv https://physionet.org/files/wearable-exam-stress/1.0.0/data/S8/Final/EDA.csv
          curl --fail --location --retry 3 --output .ci-data/IBI.csv https://physionet.org/files/wearable-exam-stress/1.0.0/data/S8/Final/IBI.csv
      - name: Validate actual recorded data through Phase 2 contract
        run: |
          python scripts/validate_physionet_exam_stress.py --eda .ci-data/EDA.csv --ibi .ci-data/IBI.csv --duration-s 300
